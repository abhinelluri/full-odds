    if(h){const t=targetFor(h,s);
      if(!s.isPhase&&t!=null&&!h.caughtTargets.includes(t)){h.caughtTargets.push(t);s.target=t;if(!remaining(h).length){h.status='done';h.ended=s.caught}}
      if(s.isPhase&&s.target!=null){h.caughtTargets=h.caughtTargets.filter(x=>x!==s.target);if(h.status==='done'){h.status='active';h.ended=null}}}
    save(true);rerender();refreshDrawer()},
  'evolve':a=>{const s=findS(a.dataset.id);const to=+a.dataset.key;const before=JSON.stringify({dexKey:s.dexKey,caughtAs:s.caughtAs,evos:s.evos,sprite:s.sprite});
    if(s.caughtAs==null) s.caughtAs=s.dexKey; s.evos=[...(s.evos||[]),{from:s.dexKey,to,date:today()}]; s.dexKey=to; 
    save(true);rerender();refreshDrawer();burst();
    toast(`${s.nickname||dexName(s.evos.at(-1).from)} evolved into ${dexName(to)}`,()=>{Object.assign(s,JSON.parse(before));save(true);rerender();refreshDrawer()})},
  'unevolve':a=>{const s=findS(a.dataset.id);const before=JSON.stringify({dexKey:s.dexKey,caughtAs:s.caughtAs,evos:s.evos});
    s.dexKey=origKey(s);s.caughtAs=null;s.evos=[];save(true);rerender();refreshDrawer();
    toast(`Back to ${dexName(s.dexKey)}`,()=>{Object.assign(s,JSON.parse(before));save(true);rerender();refreshDrawer()})},
  'open-shiny':a=>shinyDrawer(a.dataset.id),
  'open-hunt':a=>{if(a.closest('.hunt')){S.ui.focus=a.dataset.id;$$('.hunt').forEach(c=>c.classList.toggle('focus',c.dataset.hunt===a.dataset.id));save(false,{touch:false})}huntDrawer(a.dataset.id)},
  'open-dex':a=>dexDrawer(a.dataset.key),
  'close-drawer':()=>closeDrawer(),
  'close-modal':()=>$('#modal').close(),
  'fav':a=>{const s=findS(a.dataset.id);s.favorite=!s.favorite;save(true);rerender();refreshDrawer()},
  'shiny-sprite':a=>{const s=findS(a.dataset.id);s.sprite=a.dataset.v==='auto'?null:a.dataset.v;save(true);rerender();refreshDrawer()},
  'sprite-set':a=>{S.settings.spriteSet=a.dataset.v;save(true);rerender();toast('Sprite style updated')},
  'toggle-coll':a=>{const o=a.dataset.kind==='shiny'?findS(a.dataset.id):findH(a.dataset.id);const c=a.dataset.c;o.collections=o.collections.includes(c)?o.collections.filter(x=>x!==c):[...o.collections,c];save(true);a.setAttribute('aria-pressed',o.collections.includes(c));rerender()},
  'del-log':a=>{const o=a.dataset.kind==='shiny'?findS(a.dataset.id):findH(a.dataset.id);o.log=o.log.filter(l=>l.id!==a.dataset.log);save(true);refreshDrawer();rerender()},
  'shiny-view':a=>{S.ui.shinyView=a.dataset.v;save(false,{touch:false});rerender()},
  'dex-boxes':a=>{S.ui.dex.boxes=a.dataset.v==='1';save(false,{touch:false});rerender()},
  'chip':a=>{const on=a.getAttribute('aria-pressed')!=='true';a.setAttribute('aria-pressed',on);
    if(on&&a.dataset.game){const g=$(`[data-chips=games] [data-v="${CSS.escape(a.dataset.game)}"]`,a.closest('form'));g&&g.setAttribute('aria-pressed','true')}},
  'swatch':a=>{$$('button',a.parentNode).forEach(b=>b.setAttribute('aria-pressed','false'));a.setAttribute('aria-pressed','true')},
  'pick-add':a=>{const p=a.closest('.picker');const k=+a.dataset.key;setPicker(p,p.dataset.multi==='1'?[...new Set([...pickerVal(p),k])]:[k]);const inp=$('input',p);inp.value='';$('.plist',p).innerHTML='';if(p.dataset.multi==='1')inp.focus()},
  'pick-remove':a=>{const p=a.closest('.picker');setPicker(p,pickerVal(p).filter(k=>k!==+a.dataset.key))},
  'pick-target':a=>setPicker($('#modal [data-picker=dexKey]'),[+a.dataset.key]),
  'new-cart':()=>cartModal({id:uid(),name:'',game:null,gen:0,lang:'ENG',format:'Physical',tid:'',sid:'',use:'Not in Use',progress:'',backedUp:false,notes:''},true),
  'edit-cart':a=>cartModal(findC(a.dataset.id),false),
  'open-cart':a=>{location.hash='#/carts/'+a.dataset.id},
  'toggle-backup':a=>{const c=findC(a.dataset.id);c.backedUp=!c.backedUp;save(true);rerender()},
  'del-cart':a=>{const c=findC(a.dataset.id);const uses=S.hunts.filter(h=>h.carts.includes(c.id)).length+S.shinies.filter(s=>s.carts.includes(c.id)).length;
    if(!confirm(`Delete ${c.name}?${uses?` It is linked to ${uses} hunt${uses===1?'':'s'} or shinies; those keep everything else.`:''}`))return;
    S.carts=S.carts.filter(x=>x!==c);[...S.hunts,...S.shinies].forEach(o=>o.carts=o.carts.filter(x=>x!==c.id));save(true);$('#modal').close();location.hash='#/carts';toast('Cart deleted')},
  'new-coll':()=>collModal({id:uid(),name:'',desc:'',color:COLL_COLORS[S.collections.length%COLL_COLORS.length]},true),
  'edit-coll':a=>collModal(S.collections.find(c=>c.id===a.dataset.id),false),
  'open-coll':a=>{location.hash='#/collections/'+a.dataset.id},
  'coll-add':a=>collAddModal(S.collections.find(c=>c.id===a.dataset.id)),
  'del-coll':a=>{const c=S.collections.find(c=>c.id===a.dataset.id);if(!confirm(`Delete the collection “${c.name}”? Its shinies and hunts are kept.`))return;S.collections=S.collections.filter(x=>x!==c);[...S.shinies,...S.hunts].forEach(o=>o.collections=o.collections.filter(x=>x!==c.id));save(true);$('#modal').close();location.hash='#/collections';toast('Collection deleted')},
  'del-journal':a=>{const j=S.journal.find(j=>j.id===a.dataset.id);const i=S.journal.indexOf(j);S.journal.splice(i,1);save(true);rerender();toast('Entry deleted',()=>{S.journal.splice(i,0,j);save(true);rerender()})},
  'wake':a=>{S.settings.wake=!S.settings.wake;save(false,{touch:false});a.setAttribute('aria-pressed',S.settings.wake);S.settings.wake?Wake.on():Wake.off();if(S.settings.wake&&!('wakeLock' in navigator))toast('This browser can’t keep the screen on')},
  'haptics':a=>{S.settings.haptics=!S.settings.haptics;save(false,{touch:false});a.setAttribute('aria-pressed',S.settings.haptics);buzz(20)},
  'export':()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=`full-odds-backup-${today()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup downloaded')},
  'reset':()=>{if(!confirm('Erase everything and go back to the Notion starting data? Download a backup first if you want to keep anything.'))return;S=seed();save(true);rerender();toast('Reset done')},
  'sync-now':()=>{Sync.lastPull=0;Sync.pull().then(()=>{rerender()})},
  'sync-off':()=>{if(!confirm('Disconnect this device? Your data stays here and in the gist.'))return;Sync.disconnect();rerender()},
  'undo':()=>{undoFn&&undoFn();undoFn=null;$('#toast').classList.remove('on')},
};
document.addEventListener('click',e=>{
  const th=e.target.closest('th[data-sort]'); if(th){const k=th.dataset.sort;huntSort=huntSort.k===k?{k,d:-huntSort.d}:{k,d:-1};$('#huntTable').innerHTML=huntTable(S.hunts,true);return}
  const a=e.target.closest('[data-act]');
  if(!a){$$('.plist').forEach(l=>{if(!l.closest('.picker').contains(e.target))l.innerHTML=''});return}
  const f=ACT[a.dataset.act]; if(f){e.preventDefault();f(a,e)}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='jform'){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));S.journal.push({id:uid(),date:o.date||today(),title:o.title.trim(),text:o.text.trim()});save(true);rerender();toast('Added to journal');return}
  if(e.target.id==='syncform'){e.preventDefault();const t=new FormData(e.target).get('token');Sync.connect(t).then(ok=>{rerender();if(ok)toast('Sync connected')});return}
  const k=e.target.dataset.addlog; if(k){e.preventDefault();const o=k==='shiny'?findS(e.target.dataset.id):findH(e.target.dataset.id);const text=new FormData(e.target).get('text').trim();if(!text)return;o.log.push({id:uid(),date:today(),text});save(true);refreshDrawer();rerender()}
});
document.addEventListener('input',e=>{
  const p=e.target.closest('.picker'); if(p&&e.target.tagName==='INPUT'){
    const q=e.target.value.trim().toLowerCase(); const list=$('.plist',p);
    if(!q){list.innerHTML='';return}
    const hits=DEX.filter(x=>x.name.toLowerCase().includes(q)||String(x.dex)===q.replace('#','')).sort((a,b)=>(b.name.toLowerCase().startsWith(q))-(a.name.toLowerCase().startsWith(q))||a.key-b.key).slice(0,30);
    list.innerHTML=hits.map((x,i)=>`<button type="button" class="${i===0?'act':''}" data-act="pick-add" data-key="${x.key}">${sprite(x.key,{set:'bw'})}${esc(x.name)}<span class="no">#${x.dex}</span></button>`).join('')||'<span class="hint" style="padding:10px;display:block">No Gen 1–5 Pokémon by that name</span>';
    return;
  }
  const refocus=sel=>{const inp=$(sel);if(!inp)return;inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)};
  if(e.target.dataset.filter==='q'){shinyF.q=e.target.value;$('#shinyList').innerHTML='';const y=scrollY;$('#view').innerHTML=V.shinies();refocus('[data-filter=q]');scrollTo(0,y);return}
  if(e.target.dataset.cartf==='q'){cartF.q=e.target.value;const y=scrollY;$('#view').innerHTML=V.carts();refocus('[data-cartf=q]');scrollTo(0,y);return}
  if(e.target.dataset.dex==='q'){S.ui.dex.q=e.target.value;clearTimeout(window._dq);window._dq=setTimeout(()=>{save(false,{touch:false});rerender();refocus('[data-dex=q]')},180)}
});
document.addEventListener('keydown',e=>{
  const p=e.target.closest?.('.picker'); if(!p||e.target.tagName!=='INPUT') return;
  if(e.key==='Enter'){e.preventDefault();const b=$('.plist .act',p)||$('.plist button',p);b&&b.click()}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const bs=$$('.plist button',p);if(!bs.length)return;let i=bs.findIndex(b=>b.classList.contains('act'));bs[i]?.classList.remove('act');i=(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[i].classList.add('act');bs[i].scrollIntoView({block:'nearest'})}
},true);
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.filter&&t.dataset.filter!=='q'){shinyF[t.dataset.filter]=t.value;rerender();return}
  if(t.dataset.cartf&&t.dataset.cartf!=='q'){cartF[t.dataset.cartf]=t.value;rerender();return}
  if(t.dataset.dex&&t.dataset.dex!=='q'){S.ui.dex[t.dataset.dex]=t.value;save(false,{touch:false});rerender();return}
  if(t.closest('#setform')){const fd=new FormData($('#setform'));Object.assign(S.settings,{trainer:fd.get('trainer').trim(),odds:Math.max(1,+fd.get('odds')||8192),theme:fd.get('theme'),includeEvents:fd.get('includeEvents')==='1'});save(true);rerender();toast('Settings saved');return}
  if(t.id==='importFile'){const file=t.files[0];if(!file)return;file.text().then(txt=>{let d;try{d=JSON.parse(txt)}catch{return toast('That file isn’t valid JSON')}if(!d||!Array.isArray(d.shinies)||!Array.isArray(d.hunts))return toast('That file isn’t a Full Odds backup');if(!confirm(`Replace everything here with this backup (${d.shinies.length} shinies, ${d.hunts.length} hunts)?`))return;S=normalize(d);save(true);rerender();toast('Backup restored')})}
});
$('#modal').addEventListener('close',()=>{$('#modal').innerHTML=''});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
route();
if(Sync.on()){Sync.set('busy');Sync.pull()}
</script>
</body>
</html>
